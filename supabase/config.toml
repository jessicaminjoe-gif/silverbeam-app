project_id = "silverbeam-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "silverbeam://"
additional_redirect_urls = ["silverbeam://"]
jwt_expiry = 3600
enable_signup = true
# Lets a senior's device be set up with no email or phone number at all —
# a family member sets it up once, in person, and it stays signed in
# indefinitely. Supabase supports upgrading an anonymous account to a real
# one later via supabase.auth.updateUser({ email }) or { phone }; the
# underlying user id and all their data carry over unchanged. That upgrade
# UI is intentionally not built yet (beta scope), but nothing here blocks
# adding it post-beta.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
# Disabled for the beta: family signup creates the profiles row immediately
# after signUp(), which needs an active session. With confirmation required,
# signUp() returns no session until the link is clicked, so that insert runs
# unauthenticated and RLS correctly rejects it. Revisit before public launch
# — see README for the "check your email" alternative.
enable_confirmations = false

[edge_runtime]
enabled = true

[functions.chat]
verify_jwt = true

[functions.create-call]
verify_jwt = true
